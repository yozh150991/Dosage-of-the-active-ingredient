<meta name="description" content="Разова доза парацетамолу та ібупрофену за вагою дитини. Працює офлайн, дані лишаються у браузері.">

<style>
/* Шрифти лежать у репозиторії — жодного зовнішнього запиту, працює офлайн.
   Archivo (макет) не має кирилиці взагалі: у ньому лише latin, latin-ext
   і vietnamese. Тому кирилицю закриває Manrope — теж варіативний гротеск
   із вагою до 800. Розділені через unicode-range, браузер вантажить
   лише ту підмножину, яка справді потрібна поточній мові.
   Обидва під ліцензією SIL OFL 1.1, тексти ліцензій — у fonts/. */
@font-face{
  font-family:AppSans;font-style:normal;font-weight:100 900;font-display:swap;
  src:url(fonts/archivo-latin-wght-normal.woff2) format('woff2');
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;
}
@font-face{
  font-family:AppSans;font-style:normal;font-weight:100 900;font-display:swap;
  src:url(fonts/archivo-latin-ext-wght-normal.woff2) format('woff2');
  unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF;
}
@font-face{
  font-family:AppSans;font-style:normal;font-weight:100 900;font-display:swap;
  src:url(fonts/manrope-cyrillic-wght-normal.woff2) format('woff2');
  unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116;
}
@font-face{
  font-family:AppSans;font-style:normal;font-weight:100 900;font-display:swap;
  src:url(fonts/manrope-cyrillic-ext-wght-normal.woff2) format('woff2');
  unicode-range:U+0460-052F,U+1C80-1C8A,U+20B4,U+2DE0-2DFF,U+A640-A69F,U+FE2E-FE2F;
}
:root{
  --color-bg:#f3f2f2; --color-surface:#eae9e9; --color-text:#201e1d;
  --color-accent:#ec3013; --color-accent-300:#ffc4b8; --color-accent-700:#ae1800;
  --color-divider:rgba(32,30,29,.40);
  --color-neutral-600:#7d7979; --color-neutral-700:#605d5d; --color-neutral-800:#444141;
  --ok:#1f7a4d;
  --shadow-sm:0 1px 2px rgba(45,43,43,.14);
  --shadow-md:0 3px 10px rgba(45,43,43,.16);
  --shadow-lg:0 12px 32px rgba(45,43,43,.22);
}
:root[data-theme="dark"]{
  --color-bg:#181716; --color-surface:#232120; --color-text:#f4f2f1;
  --color-divider:rgba(244,242,241,.22);
  --color-neutral-600:#a29d9c; --color-neutral-700:#c3bebd; --color-neutral-800:#ded9d8;
  --color-accent-300:#7c1405; --color-accent-700:#ff9783;
  --ok:#3fa06c;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--color-bg);color:var(--color-text);
  font-family:AppSans,system-ui,sans-serif;font-size:15px;line-height:1.55;
  transition:background .2s;-webkit-text-size-adjust:100%;
}
h1,h2,h3{font-weight:800;letter-spacing:-.02em;line-height:1.1;margin:0}
button,input,select{font-family:inherit}
:focus-visible{outline:2px solid var(--color-accent);outline-offset:2px}
.app{container-type:inline-size;max-width:1180px;margin:0 auto}

/* ── службова смуга ── */
.util{
  position:sticky;top:0;z-index:9;display:flex;gap:8px;flex-wrap:wrap;align-items:center;
  padding:12px 18px;border-bottom:1px solid var(--color-divider);background:var(--color-bg);
}
.wordmark{font-weight:800;font-size:16px;letter-spacing:-.02em;white-space:nowrap;margin-right:auto}
.wordmark i{color:var(--color-accent);font-style:normal}
.pillgroup{display:flex;gap:2px;padding:3px;background:var(--color-surface);border-radius:999px}
.pillgroup button{
  border:0;border-radius:999px;padding:7px 13px;font-weight:800;font-size:12px;
  letter-spacing:.03em;background:transparent;color:var(--color-neutral-700);cursor:pointer;transition:all .15s;
}
.pillgroup button[aria-pressed="true"]{background:var(--color-text);color:var(--color-bg)}
.toggle{
  border:1px solid var(--color-divider);border-radius:999px;padding:8px 14px;
  font-weight:800;font-size:12px;background:transparent;color:var(--color-text);cursor:pointer;transition:all .15s;
}
.toggle[aria-pressed="true"]{background:var(--color-text);color:var(--color-bg);border-color:var(--color-text)}

/* ── шапка ── */
.head{padding:26px 18px 16px}
.kicker{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--color-neutral-600);margin:0 0 10px}
.head h1{font-size:clamp(28px,4.2cqw,42px);letter-spacing:-.035em;line-height:1.06;max-width:18ch;overflow-wrap:break-word}
.head p{margin:12px 0 0;max-width:58ch;color:var(--color-neutral-700)}

/* ── вкладки ── */
.tabswrap{position:sticky;top:53px;z-index:8;padding:8px 18px 14px;background:var(--color-bg)}
.tabs{display:flex;gap:4px;padding:4px;background:var(--color-surface);border-radius:999px}
.tabs button{
  flex:1;border:0;border-radius:999px;padding:12px 10px;font-weight:800;font-size:14px;
  background:transparent;color:var(--color-neutral-600);cursor:pointer;transition:all .15s;
}
.tabs button[aria-selected="true"]{background:var(--color-text);color:var(--color-bg);box-shadow:var(--shadow-md)}

/* ── сітка ── */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px;column-gap:22px;align-items:start;padding:0 18px 48px}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
.col.left{gap:22px}
@media (min-width:760px){ .col.right{position:sticky;top:124px} }
.card{background:var(--color-surface);border-radius:20px;padding:20px}
.lbl{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.09em;color:var(--color-text)}
.lblrow{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:12px}
.lblrow span{font-size:12px;color:var(--color-neutral-600);font-weight:400;text-transform:none;letter-spacing:0}
.sect{margin-top:18px}

/* ── ввід ── */
.weightbox{display:flex;background:var(--color-bg);border:2px solid var(--color-divider);border-radius:18px;transition:all .15s}
.weightbox.ok{border-color:var(--ok)}
.weightbox.bad{border-color:var(--color-accent)}
.weightbox input{
  flex:1;min-width:0;border:0;background:transparent;color:var(--color-text);
  font-weight:800;font-size:clamp(34px,6cqw,44px);padding:16px 18px;caret-color:var(--color-accent);
}
.weightbox input::-webkit-outer-spin-button,.weightbox input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.weightbox input[type=number]{-moz-appearance:textfield}
.unitside{display:flex;align-items:center;gap:12px;padding:0 18px}
.unitside b{font-weight:800;font-size:18px;color:var(--color-neutral-600);align-self:flex-end;padding-bottom:18px}
.badge{width:22px;height:22px;border-radius:999px;background:var(--ok);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:800;line-height:1;align-self:center}
.agerow{display:flex;gap:10px;margin-top:14px}
.agefield{flex:1;display:flex;align-items:center;background:var(--color-bg);border:2px solid var(--color-divider);border-radius:14px;height:48px;padding-right:12px;transition:all .15s}
.agefield.ok{border-color:var(--ok)}
.agefield input{flex:1;min-width:0;border:0;background:transparent;color:var(--color-text);font-size:16px;padding:0 16px;height:44px}
select{
  height:48px;border-radius:14px;border:1px solid var(--color-divider);
  background:var(--color-bg);color:var(--color-text);font-size:16px;padding:0 12px;
}
.agerow select{width:150px;flex:0 0 auto}
.note-sm{font-size:12px;color:var(--color-neutral-600);margin:12px 0 0}

.drugs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.drugs button{
  padding:16px;border-radius:18px;border:2px solid var(--color-divider);background:var(--color-bg);
  color:var(--color-neutral-700);text-align:left;cursor:pointer;transition:all .15s;
}
.drugs button[aria-pressed="true"]{border-color:var(--color-text);background:var(--color-text);color:var(--color-bg);box-shadow:var(--shadow-md)}
.drugs b{display:block;font-weight:800;font-size:16px}
.drugs small{font-size:12px;opacity:.75}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{
  padding:10px 18px;border-radius:999px;border:2px solid var(--color-divider);background:transparent;
  color:var(--color-neutral-700);font-size:14px;cursor:pointer;transition:all .15s;
}
.chips button[aria-pressed="true"]{background:var(--color-text);border-color:var(--color-text);color:var(--color-bg);font-weight:800;box-shadow:var(--shadow-md)}
.strength{width:100%;height:52px}
.ghost{
  width:100%;height:46px;border-radius:14px;border:1px solid var(--color-divider);
  background:transparent;color:var(--color-text);font-weight:800;font-size:14px;cursor:pointer;white-space:nowrap;
}

/* ── результат ── */
.result{border-radius:24px;padding:24px;background:var(--color-surface);color:var(--color-neutral-700)}
.result.on{background:var(--color-text);color:var(--color-bg)}
.result .kicker{color:inherit;opacity:.75;margin-bottom:14px}
.figure{font-weight:800;font-size:clamp(46px,7cqw,72px);line-height:.88;letter-spacing:-.035em}
.figure span{font-size:20px;font-weight:800;opacity:.7;letter-spacing:0}
.second{font-size:15px;opacity:.85;margin:14px 0 0}
.cta{width:100%;height:50px;border-radius:14px;border:0;font-weight:800;font-size:15px;margin-top:18px;cursor:pointer;background:var(--color-bg);color:var(--color-text)}
.result.blocked{background:var(--color-accent);color:#fff}
.result.blocked .figure{font-size:clamp(21px,3cqw,27px);line-height:1.12}

/* ── червоні блоки ── */
.alert{border-radius:20px;padding:20px;background:var(--color-accent);color:#fff}
.alert-head{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.alert-head i{width:26px;height:26px;border-radius:999px;background:#fff;color:var(--color-accent);display:grid;place-items:center;font-style:normal;font-weight:800;font-size:15px}
.alert-head b{font-size:13px;text-transform:uppercase;letter-spacing:.09em;font-weight:800}
.alert p{margin:0;padding:9px 0;border-top:1px solid rgba(255,255,255,.3);font-size:15px}
.alert p b{font-weight:800}
.poster{border-radius:24px;padding:24px;background:var(--color-accent);color:#fff}
.poster h2{font-size:clamp(21px,3cqw,27px);line-height:1.12;margin-bottom:8px}
.poster p{margin:0;padding:9px 0;border-top:1px solid rgba(255,255,255,.32);font-size:14px;display:flex;gap:10px}
.poster p i{font-style:normal;opacity:.8}
.soft{border-radius:20px;padding:20px;background:var(--color-surface)}
.soft p{margin:0;padding:9px 0;border-top:1px solid var(--color-divider);font-size:15px}
.soft .alert-head i{background:var(--color-accent);color:#fff}
.soft .alert-head b{color:var(--color-accent-700)}

/* ── рядки деталей ── */
.rows div{display:flex;justify-content:space-between;gap:14px;padding:12px 0;border-bottom:1px solid var(--color-divider)}
.rows div:last-child{border-bottom:0}
.rows dt{margin:0;font-size:13px;color:var(--color-neutral-700)}
.rows dd{margin:0;font-weight:800;font-size:15px;white-space:nowrap;text-align:right}
.steps{display:flex;flex-direction:column;gap:12px}
.step{display:flex;gap:12px;align-items:flex-start;font-size:14px}
.step i{flex:0 0 auto;width:22px;height:22px;border-radius:999px;background:var(--color-text);color:var(--color-bg);display:grid;place-items:center;font-style:normal;font-weight:800;font-size:11px}

/* ── таймери ── */
.timerhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.timerhead b{font-weight:800;font-size:17px}
.status{border-radius:999px;padding:5px 12px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;border:1px solid var(--color-divider);color:var(--color-neutral-600)}
.status.go{background:var(--color-text);color:var(--color-bg);border-color:var(--color-text)}
.timerfig{font-weight:800;font-size:clamp(34px,5cqw,48px);line-height:1;letter-spacing:-.03em}
.timernote{font-size:13px;color:var(--color-neutral-700);margin:10px 0 0}
.bar{height:6px;background:var(--color-bg);border-radius:999px;margin-top:16px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--color-neutral-700);border-radius:999px;transition:width .3s}
.bar.hot i{background:var(--color-accent)}
.barcap{font-size:12px;color:var(--color-neutral-600);margin:8px 0 0}
.logrow{display:flex;gap:12px;padding:11px 0;border-top:1px solid var(--color-divider);font-size:14px;align-items:baseline}
.logrow b{font-weight:800;font-size:15px;min-width:52px}
.logrow span:last-child{margin-left:auto;color:var(--color-neutral-700)}
.mini{border-radius:999px;padding:6px 12px;font-size:12px;border:1px solid var(--color-divider);background:transparent;color:var(--color-text);cursor:pointer;font-weight:800}
.srcgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.srcgrid h3{font-size:16px;margin-bottom:8px}
.srcgrid p{margin:0;font-size:14px;color:var(--color-neutral-700)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:9px 8px 9px 0;border-bottom:1px solid var(--color-divider);vertical-align:top}
th{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--color-neutral-600)}
.disclaimer{font-size:13px;color:var(--color-neutral-600);max-width:72ch;padding:0 18px 40px}
[hidden]{display:none !important}
</style>
</head>
<body>
<div class="app">

<div class="util">
  <div class="wordmark" id="wordmark"></div>
  <div class="pillgroup" role="group" aria-label="Мова">
    <button type="button" id="lang-uk" aria-pressed="true">UA</button>
    <button type="button" id="lang-en" aria-pressed="false">EN</button>
  </div>
  <button type="button" class="toggle" id="theme" aria-pressed="false"></button>
</div>

<header class="head">
  <p class="kicker" id="kicker"></p>
  <h1 id="h1"></h1>
  <p id="sub"></p>
</header>

<div class="tabswrap">
  <div class="tabs" role="tablist">
    <button role="tab" id="tab-dose" aria-selected="true"></button>
    <button role="tab" id="tab-next" aria-selected="false"></button>
    <button role="tab" id="tab-src" aria-selected="false"></button>
  </div>
</div>

<!-- ══ ДОЗА ══ -->
<div class="grid" id="view-dose">
  <div class="col left">
    <section class="card">
      <div class="lblrow"><span class="lbl" id="l-weight"></span><span id="l-required"></span></div>
      <div class="weightbox" id="weightbox">
        <input type="number" id="weight" inputmode="decimal" step="0.1" min="0" autocomplete="off">
        <div class="unitside"><b id="l-kg"></b><div class="badge" id="w-ok" hidden>✓</div></div>
      </div>
      <div class="agerow">
        <div class="agefield" id="agefield">
          <input type="number" id="age" inputmode="numeric" step="1" min="0" autocomplete="off">
          <div class="badge" id="a-ok" hidden>✓</div>
        </div>
        <select id="ageUnit"><option value="years"></option><option value="months"></option></select>
      </div>
      <p class="note-sm" id="l-agenote"></p>
    </section>

    <section class="soft" id="alert-child" hidden>
      <div class="alert-head"><i>!</i><b id="l-attention1"></b></div>
      <div id="alert-child-body"></div>
    </section>

    <section class="card">
      <div class="lblrow"><span class="lbl" id="l-drug"></span></div>
      <div class="drugs">
        <button type="button" id="d-paracetamol" aria-pressed="true"><b></b><small>10–15 мг/кг</small></button>
        <button type="button" id="d-ibuprofen" aria-pressed="false"><b></b><small>5–10 мг/кг</small></button>
      </div>
      <div class="sect">
        <div class="lblrow"><span class="lbl" id="l-form"></span></div>
        <div class="chips" id="chips"></div>
      </div>
      <div class="sect">
        <p class="note-sm" style="margin:0 0 8px" id="l-strength"></p>
        <select class="strength" id="preset"></select>
      </div>
      <div class="sect"><button type="button" class="ghost" id="clear"></button></div>
    </section>
  </div>

  <div class="col right">
    <section class="result" id="result"></section>
    <section class="alert" id="alert-drug" hidden>
      <div class="alert-head"><i>!</i><b id="l-attention2"></b></div>
      <div id="alert-drug-body"></div>
    </section>
    <section class="card" id="detail" hidden><div class="rows" id="rows"></div></section>
    <section class="card" id="howcard" hidden>
      <div class="lblrow"><span class="lbl" id="l-how"></span></div>
      <div class="steps" id="steps"></div>
    </section>
    <section class="poster" id="poster"></section>
  </div>
</div>

<!-- ══ КОЛИ ДАЛІ ══ -->
<div class="grid" id="view-next" hidden>
  <div class="col left">
    <section class="card" id="timer-paracetamol"></section>
    <section class="card" id="timer-ibuprofen"></section>
    <section class="card">
      <div class="lblrow"><span class="lbl" id="l-alt"></span></div>
      <div id="alt-body"></div>
    </section>
  </div>
  <div class="col right">
    <section class="card">
      <div class="lblrow">
        <span class="lbl" id="l-log"></span>
        <button type="button" class="mini" id="undo"></button>
      </div>
      <div id="logbody"></div>
    </section>
    <section class="poster" id="poster2"></section>
  </div>
</div>

<!-- ══ ДЖЕРЕЛА ══ -->
<div id="view-src" hidden>
  <div class="grid" style="padding-bottom:16px"><div class="srcgrid" id="srccards" style="grid-column:1/-1"></div></div>
  <div class="grid" style="padding-bottom:16px">
    <section class="card"><div class="lblrow"><span class="lbl" id="l-forbidden"></span></div><table id="t-forbidden"></table></section>
    <section class="card">
      <div class="lblrow"><span class="lbl" id="l-combined"></span></div>
      <p class="note-sm" style="margin:0 0 10px" id="l-combined-sub"></p>
      <table id="t-combined"></table>
    </section>
  </div>
  <p class="disclaimer" id="disclaimer"></p>
</div>

</div>

/* Максимум неподільних одиниць на один прийом.
   Свічок і саше — дві; жувальних капсул інструкція допускає до трьох
   (Nurofen Junior: 30-40 кг = 3 капсули), тому тут межа вища. */
const MAX_UNITS = { supp: 2, sachet: 2, chew: 4 };
const MAX_SUPPOSITORIES = MAX_UNITS.supp;

/* Разова доза.
   Повертає { ok, error } або { ok:true, amount, unit, actualMg, ... , flags }.
   flags — машинні коди проблем форми випуску, тексти живуть у buildWarnings. */
function computeDose(input) {
  const drug = DRUGS[input.drug];
  const form = input.form;
  const weight = Number(input.weightKg);
  const concMg = Number(input.concMg);
  const concMl = form === "syrup" ? Number(input.concMl) : null;

  if (!drug) return { ok: false, error: "drug" };
  if (!FORM_LABEL[form]) return { ok: false, error: "form" };
  if (!isFinite(weight) || weight < 2 || weight > 120) return { ok: false, error: "weight" };
  if (!isFinite(concMg) || concMg <= 0) return { ok: false, error: "concentration" };
  if (form === "syrup" && (!isFinite(concMl) || concMl <= 0)) return { ok: false, error: "concentration" };

  const minMg = drug.perKg.min * weight;
  const maxMg = Math.min(drug.perKg.max * weight, drug.maxSingleMg);
  const targetMg = Math.min(drug.perKg.typical * weight, drug.maxSingleMg);
  const dailyLimitMg = Math.min(drug.dailyPerKg * weight, drug.maxDailyMg);

  const flags = [];
  let amount, unit, actualMg;

  if (form === "syrup") {
    const mgPerMl = concMg / concMl;
    const step = targetMg / mgPerMl >= 5 ? 0.5 : 0.25;
    let ml = Math.round(targetMg / mgPerMl / step) * step;
    while (ml * mgPerMl > maxMg && ml > step) ml -= step;
    if (ml < step) ml = step;
    amount = Number(ml.toFixed(2));
    unit = "ml";
    actualMg = amount * mgPerMl;
    if (amount > 20) flags.push("volume_large");
    if (mgPerMl >= CONC_DROPS) flags.push("conc_drops");
    else if (mgPerMl >= CONC_FORTE) flags.push("conc_forte");
  } else if (form === "supp" || form === "sachet" || form === "chew") {
    /* Більше двох свічок за раз не вводять: якщо арифметика вимагає більше,
       номінал просто замалий для цієї ваги. Знайдено тестом на 25 кг × 80 мг,
       де розрахунок пропонував 4 свічки. */
    const wanted = Math.round(targetMg / concMg);
    let n = Math.max(1, Math.min(MAX_UNITS[form], wanted));
    while (n * concMg > maxMg && n > 1) n--;
    amount = n;
    unit = form;
    actualMg = n * concMg;
    if (actualMg > maxMg) flags.push(form + "_too_large");
    else if (actualMg < minMg) flags.push(form + "_below_min");
  } else {
    const step = 0.5;
    let n = Math.max(step, Math.round(targetMg / concMg / step) * step);
    while (n * concMg > maxMg && n > step) n -= step;
    amount = n;
    unit = "tab";
    actualMg = n * concMg;
    if (actualMg > maxMg) flags.push("tab_too_large");
  }

  const dosesPerDay = Math.max(1, Math.min(drug.maxDoses, Math.floor(dailyLimitMg / actualMg)));

  return {
    ok: true,
    amount: amount,
    unit: unit,
    actualMg: actualMg,
    mgPerKg: actualMg / weight,
    minMg: minMg,
    maxMg: maxMg,
    dailyLimitMg: dailyLimitMg,
    dosesPerDay: dosesPerDay,
    flags: flags
  };
}

/* Гейти допуску: чи можна цьому препарату в цій формі бути в руках цієї дитини.
   Залежать тільки від вводу, не від арифметики дози — тому викликаються ДО неї.
   level "block" означає, що доза не показується взагалі.
   Тексти живуть в i18n.js — тут лише коди й підстановки. */
function checkGates(input) {
  const out = [];
  const push = (level, code, vars) => out.push({ level: level, code: code, vars: vars || {} });

  const drugId = input.drug;
  const drug = DRUGS[drugId];
  if (!drug) return out;
  const lim = LIMITS[drugId];
  const form = input.form;
  const weight = Number(input.weightKg);
  const conc = Number(input.concMg);
  const concMl = Number(input.concMl);
  const months =
    input.ageMonths === null || input.ageMonths === undefined || input.ageMonths === ""
      ? null
      : Number(input.ageMonths);
  const knownAge = months !== null && isFinite(months);
  const knownWeight = isFinite(weight) && weight > 0;

  /* 1. Гарячка в перші три місяці — це завжди лікар */
  if (knownAge && months < LIMITS.doctorOnlyAgeMonths) {
    push("block", "age_under_3m");
    return out;
  }

  /* 2. Ібупрофен: нижня межа і зона обережності */
  if (drugId === "ibuprofen") {
    /* Окремої гілки "ібупрофен до 3 місяців" тут немає навмисно:
       гейт doctorOnlyAgeMonths вище блокує цей вік для обох препаратів
       і одразу виходить. Тест на осиротілі коди колись це вже спіймав. */
    if (knownAge && months < lim.cautionAgeMonths) {
      push("warn", "ibu_under_6m");
    }
    if (knownWeight && weight < lim.minWeightKg) {
      push("block", "ibu_weight_below_5", { kg: lim.minWeightKg });
    } else if (form === "supp" && knownWeight && weight < lim.suppMinWeightKg) {
      push("block", "ibu_supp_weight_below_6", { kg: lim.suppMinWeightKg });
    }
    if (form === "syrup" && isFinite(conc) && isFinite(concMl) && conc / concMl >= CONC_FORTE) {
      if (knownAge && months < lim.forteMinAgeMonths) {
        push("warn", "ibu_forte_age");
      } else if (knownWeight && weight < lim.forteMinWeightKg) {
        push("warn", "ibu_forte_weight", { kg: lim.forteMinWeightKg });
      }
    }
  }

  /* 3. Парацетамол: нижня межа за масою */
  if (drugId === "paracetamol" && knownWeight && weight < lim.minWeightKg) {
    push("block", "par_weight_below_4", { kg: lim.minWeightKg });
  }

  /* 4. Тверді таблетки: аспірація важливіша за арифметику */
  if (form === "tab") {
    const tabRule = (lim.tab && lim.tab[conc]) || null;
    const minAge = tabRule ? tabRule.minAgeMonths : LIMITS.paracetamol.tabMinAgeMonths;
    if (knownAge && months < minAge) {
      push("block", "tab_age", { mg: conc, years: Math.round(minAge / 12) });
    } else if (!knownAge) {
      push("warn", "tab_age_unknown");
    }
    if (drugId === "paracetamol" && conc >= 500 && knownAge &&
        months >= LIMITS.paracetamol.tabMinAgeMonths &&
        months < LIMITS.paracetamol.tab500PlMinAgeMonths) {
      push("warn", "par_tab_500_age");
    }
    if (tabRule && knownWeight && weight < tabRule.minWeightKg) {
      push("block", "tab_weight", { mg: conc, kg: tabRule.minWeightKg });
    }
  }

  /* 4а. Саше з гранулами: ковтати не треба, тому поріг нижчий за таблетки */
  if (form === "sachet" && isFinite(conc)) {
    const rule = lim.sachet && lim.sachet[conc];
    const minAge = rule ? rule.minAgeMonths : 48;
    if (knownAge && months < minAge) {
      push("block", "sachet_age", { mg: conc, years: Math.round(minAge / 12) });
    } else if (!knownAge) {
      push("warn", "sachet_age_unknown");
    }
  }

  /* 4б. Жувальні капсули: власне вікове і вагове вікно за інструкцією */
  if (form === "chew" && isFinite(conc)) {
    const rule = lim.chew && lim.chew[conc];
    if (rule) {
      if (knownAge && months < rule.minAgeMonths) {
        push("block", "chew_age", { mg: conc, years: Math.round(rule.minAgeMonths / 12) });
      }
      if (knownWeight && weight < rule.minWeightKg) {
        push("block", "chew_weight", { kg: rule.minWeightKg });
      } else if (rule.maxWeightKg && knownWeight && weight > rule.maxWeightKg) {
        push("warn", "chew_weight_high", { kg: rule.maxWeightKg });
      }
    }
  }

  /* 5. Свічки: номінал прив'язаний до ваги в самій інструкції */
  if (form === "supp" && isFinite(conc) && knownWeight) {
    const range = lim.supp && lim.supp[conc];
    if (range) {
      if (weight < range.min) {
        push("warn", "supp_nominal_low", { mg: conc, kg: range.min, weight: weight });
      } else if (range.max && weight > range.max) {
        push("warn", "supp_nominal_high", { mg: conc, kg: range.max });
      }
    }
  }

  /* 6. Концентрований сироп парацетамолу — форма для школярів */
  if (drugId === "paracetamol" && form === "syrup" && isFinite(conc) && isFinite(concMl) &&
      conc / concMl >= lim.concSchoolAgeMgPerMl && knownAge && months < lim.tabMinAgeMonths) {
    push("warn", "conc_school_age");
  }

  /* 7. Вік не вказано — вікові перевірки не виконані */
  if (!knownAge && form !== "tab" && form !== "sachet") {
    push("info", "age_unknown");
  }

  return out;
}

function isBlocked(notes) {
  return notes.some(function (n) { return n.level === "block"; });
}

function buildWarnings(input, dose) {
  const drug = DRUGS[input.drug];
  const weight = Number(input.weightKg);
  const flags = (dose && dose.flags) || [];
  const out = checkGates(input);
  const push = (level, code, vars) => out.push({ level: level, code: code, vars: vars || {} });

  /* Якщо препарат у цьому віці чи формі взагалі не можна — далі не міркуємо */
  if (isBlocked(out)) return out;

  const has = (f) => flags.indexOf(f) > -1;

  if (has("supp_too_large")) push("danger", "supp_too_large", { mg: input.concMg, weight: weight });
  if (has("supp_below_min")) push("warn", "supp_below_min");
  if (has("sachet_too_large")) push("danger", "sachet_too_large", { mg: input.concMg, weight: weight });
  if (has("sachet_below_min")) push("warn", "sachet_below_min");
  if (has("chew_too_large")) push("danger", "chew_too_large", { mg: input.concMg });
  if (has("chew_below_min")) push("warn", "chew_below_min");
  if (has("tab_too_large")) push("danger", "tab_too_large", { mg: input.concMg });
  if (has("volume_large")) push("warn", "volume_large");
  if (has("conc_drops")) push("warn", "conc_drops", { mgPerMl: Math.round(input.concMg / input.concMl) });
  if (has("conc_forte")) push("warn", "conc_forte");

  if (input.drug === "ibuprofen") push("info", "ibu_contraindications");

  if (isFinite(weight) && weight > 40) {
    push("info", "adult_ceiling", { single: drug.maxSingleMg, daily: drug.maxDailyMg });
  }

  push("info", "duration_limit");
  push("info", "hidden_paracetamol");

  return out;
}

/* Мінімальний проміжок між РІЗНИМИ препаратами при чергуванні, годин */
const CROSS_INTERVAL_HOURS = 3;

/* Найраніший час наступної дози.
   lastTaken — остання доза цього ж препарату, lastOther — іншого.
   Повертає ще й причину очікування: те саме ліки чи крос-правило. */
function nextDoseTime(drugId, lastTaken, dosesTaken, now, lastOther) {
  const drug = DRUGS[drugId];
  if (!drug) return null;
  const taken = Math.max(0, Number(dosesTaken) || 0);
  const valid = (d) => d instanceof Date && !isNaN(d);

  let at = null;
  let reason = "none";

    uk: (v) => "<b>" + v.mgPerMl + " мг в одному мілілітрі — це краплі, а не сироп.</b> Концентрація вчетверо вища за звичайну суспензію. Ще раз звірте цифру на флаконі.",
    en: (v) => "<b>" + v.mgPerMl + " mg per millilitre means drops, not syrup.</b> That's four times the usual suspension. Check the bottle again."
  },
  conc_forte: {
    uk: () => "Це посилена форма («форте»). Вона вдвічі концентрованіша за звичайну — переконайтеся, що у вас у руках саме той флакон.",
    en: () => "This is the \u201cforte\u201d strength — twice as concentrated as the standard one. Make sure it's the bottle in your hand."
  },
  ibu_contraindications: {
    uk: () => "Ібупрофен не дають при зневодненні, багаторазовому блюванні чи проносі, вітряній віспі, хворобах нирок і при астмі з непереносимістю НПЗЗ. Давати після їжі.",
    en: () => "Avoid ibuprofen with dehydration, repeated vomiting or diarrhoea, chickenpox, kidney disease, or NSAID-sensitive asthma. Give it after food."
  },
  adult_ceiling: {
    uk: (v) => "За такої ваги діють дорослі стелі: разова доза не більша за " + v.single + " мг, добова — за " + v.daily + " мг.",
    en: (v) => "At this weight adult ceilings apply: no more than " + v.single + " mg per dose and " + v.daily + " mg per day."
  },
  duration_limit: {
    uk: () => "Без огляду лікаря жарознижувальне дають не довше <b>3 днів</b> поспіль. Для дитини 3–6 місяців межа інша: якщо температура тримається понад <b>24 години</b>, до лікаря треба звернутися одразу.",
    en: () => "Without a doctor's review, don't give fever medicine for more than <b>3 days</b> in a row. For a 3–6 month old the limit is <b>24 hours</b>."
  },
  hidden_paracetamol: {
    uk: () => "Перевірте, чи немає парацетамолу або ібупрофену в інших ліках, які дитина вже приймає — комбіновані порошки від застуди часто їх містять. Два жарознижувальні одночасно не дають.",
    en: () => "Check whether other medicines already contain paracetamol or ibuprofen — cold and flu sachets often do. Never give two fever medicines at once."
  }
};

function noteText(note, lang) {
  const entry = NOTES[note.code];
  if (!entry) return note.code;
  const fn = entry[lang] || entry.uk;
  return fn(note.vars || {});
}

return { UI: UI, NOTES: NOTES, noteText: noteText };
});
</script>
<script>
"use strict";
const { DRUGS, GROUPS, FORM_LABEL, FORBIDDEN, COMBINED, LIMITS,
        computeDose, buildWarnings, checkGates, isBlocked, nextDoseTime } = window.Doza;
const { UI, noteText } = window.DozaI18n;

const STORE = "kids-dose-calc-v2";
const $ = (id) => document.getElementById(id);
const el = (tag, cls, html) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (html !== undefined) n.innerHTML = html;
  return n;
};

const state = {
  lang: "uk", theme: "light", tab: "dose",
  drug: "paracetamol", form: "syrup", presetIndex: 0,
  weight: "", age: "", ageUnit: "years",
  doses: []
};

/* ── збереження ── */
function save() {
  try {
    const { lang, theme, drug, form, presetIndex, weight, age, ageUnit, doses } = state;
    localStorage.setItem(STORE, JSON.stringify({ lang, theme, drug, form, presetIndex, weight, age, ageUnit, doses }));
  } catch (e) { /* приватний режим — просто не зберігаємо */ }
}
function load() {
  try {
    const raw = localStorage.getItem(STORE);
    if (!raw) return;
    const data = JSON.parse(raw);
    Object.keys(data).forEach((k) => { if (k in state) state[k] = data[k]; });
    state.doses = (state.doses || []).filter((d) => d && d.t).slice(0, 30);
  } catch (e) { /* зіпсовані дані — стартуємо з чистого */ }
}

/* ── формат ── */
const t = () => UI[state.lang];
const locale = () => (state.lang === "uk" ? "uk-UA" : "en-GB");
function nf(n, d) {
  const s = Number(n).toFixed(d === undefined ? 1 : d).replace(/\.0$/, "");
  return state.lang === "uk" ? s.replace(".", ",") : s;
}
function hhmm(ts) {
  return new Date(ts).toLocaleTimeString(locale(), { hour: "2-digit", minute: "2-digit", hour12: false });
}
function plural(list, n) { return n === 1 ? list[0] : list[1]; }

/* ── ввід ── */
const weightNum = () => { const v = parseFloat(String(state.weight).replace(",", ".")); return isFinite(v) ? v : NaN; };
function ageMonths() {
  const v = parseFloat(String(state.age).replace(",", "."));
  if (!isFinite(v) || v < 0) return null;
  return state.ageUnit === "years" ? v * 12 : v;
}
function currentPreset() {
  const list = DRUGS[state.drug].forms[state.form] || [];
  return list[state.presetIndex] || list[0] || null;
}
function input() {
  const p = currentPreset();
  return {
    drug: state.drug, form: state.form,
    weightKg: weightNum(), ageMonths: ageMonths(),
    concMg: p ? p.mg : NaN, concMl: p && p.ml ? p.ml : null
  };
}

/* ── статичні написи ── */
function paintChrome() {
  const T = t();
  document.documentElement.lang = state.lang;
  $("wordmark").innerHTML = T.wordmark[0] + '<i>.</i>' + T.wordmark[1];
  $("theme").textContent = T.dark;
  $("kicker").textContent = T.kicker;
  $("h1").textContent = T.h1;
  $("sub").textContent = T.sub;
  $("tab-dose").textContent = T.tabs.dose;
  $("tab-next").textContent = T.tabs.next;
  $("tab-src").textContent = T.tabs.src;
  $("l-weight").textContent = T.weightLabel;
  $("l-required").textContent = T.required;
  $("l-kg").textContent = T.kg;
  $("l-agenote").textContent = T.ageNote;
  $("l-drug").textContent = T.drugLabel;
  $("l-form").textContent = T.formLabel;
  $("l-attention1").textContent = T.attention;
  $("l-attention2").textContent = T.attention;
  $("l-how").textContent = T.howTitle;
  $("l-alt").textContent = T.altTitle;
  $("l-log").textContent = T.logTitle;
  $("undo").textContent = T.undo;
  $("clear").textContent = T.clear;
  $("l-forbidden").textContent = T.forbiddenTitle;
  $("l-combined").textContent = T.combinedTitle;
  $("l-combined-sub").textContent = T.combinedSub;
  $("disclaimer").textContent = T.disclaimer;
  $("d-paracetamol").querySelector("b").textContent = T.paracetamol;
  $("d-ibuprofen").querySelector("b").textContent = T.ibuprofen;
  $("weight").placeholder = state.lang === "uk" ? "12,5" : "12.5";
  $("age").placeholder = "3";
  $("ageUnit").options[0].textContent = T.years;
  $("ageUnit").options[1].textContent = T.months;
  $("lang-uk").setAttribute("aria-pressed", String(state.lang === "uk"));
  $("lang-en").setAttribute("aria-pressed", String(state.lang === "en"));

  $("steps").innerHTML = "";
  T.how.forEach((s, i) => $("steps").appendChild(el("div", "step", "<i>" + (i + 1) + "</i><span>" + s + "</span>")));

  [$("poster"), $("poster2")].forEach((p) => {
    p.innerHTML = "<h2>" + T.posterTitle + "</h2>" +
      T.poster.map((r) => '<p><i>→</i><span>' + r + "</span></p>").join("");
  });

  $("alt-body").innerHTML = T.alt.map((p) => '<p style="margin:0 0 10px;font-size:14px">' + p + "</p>").join("");

  $("srccards").innerHTML = T.srcCards
    .map((c) => '<section class="card"><h3>' + c.t + "</h3><p>" + c.b + "</p></section>").join("");
  $("t-forbidden").innerHTML = "<tr><th>" + T.thDrug + "</th><th>" + T.thRule + "</th><th>" + T.thWhy + "</th></tr>" +
    FORBIDDEN.map((f) => "<tr><td>" + f.name + "</td><td>" + f.rule + "</td><td>" + f.why + "</td></tr>").join("");
  $("t-combined").innerHTML = "<tr><th>" + T.thDrug + "</th><th>" + T.thWhat + "</th><th>" + T.thRule + "</th></tr>" +
    COMBINED.map((c) => "<tr><td>" + c.name + "</td><td>" + c.what + "</td><td>" + c.rule + "</td></tr>").join("");
}

/* ── форми та пресети ── */
function paintChips() {
  const T = t();
  const drug = DRUGS[state.drug];
  const box = $("chips");
  box.innerHTML = "";
  Object.keys(FORM_LABEL).forEach((key) => {
    const list = drug.forms[key];
    if (!Array.isArray(list) || !list.length) return;
    const b = el("button", null, T.forms[key]);
    b.type = "button";
    b.dataset.form = key;
    b.setAttribute("aria-pressed", String(key === state.form));
    box.appendChild(b);
  });
  if (!box.querySelector('[aria-pressed="true"]')) {
    const first = box.querySelector("button");
    if (first) { state.form = first.dataset.form; first.setAttribute("aria-pressed", "true"); }
  }
  $("l-strength").textContent = T.strengthLabel[state.form];
}

function paintPresets() {
  const list = DRUGS[state.drug].forms[state.form] || [];
  const sel = $("preset");
  sel.innerHTML = "";
  GROUPS.forEach(([key, title]) => {
    const items = list.map((it, i) => [it, i]).filter(([it]) => it.group === key);
    if (!items.length) return;
    const g = document.createElement("optgroup");
    g.label = title;
    items.forEach(([it, i]) => {
      const o = document.createElement("option");
      o.value = i;
      o.textContent = it.label;
      g.appendChild(o);
    });
    sel.appendChild(g);
  });
  if (state.presetIndex >= list.length) state.presetIndex = 0;
  sel.value = String(state.presetIndex);
  if (!sel.value) { state.presetIndex = Number(sel.options[0] ? sel.options[0].value : 0); sel.value = String(state.presetIndex); }
}

/* ── головний перерахунок ── */
function render() {
  const T = t();
  const inp = input();
  const w = inp.weightKg;
  const notes = buildWarnings(inp, null);
  const blocked = isBlocked(notes);

  const wValid = isFinite(w) && w >= 5 && w <= 40;
  const wBad = isFinite(w) && (w < 5 || w > 40);
  $("weightbox").className = "weightbox" + (wValid ? " ok" : wBad ? " bad" : "");
  $("w-ok").hidden = !wValid;
  const m = ageMonths();
  const aValid = m !== null && m >= 3 && m < 216 && !(state.drug === "ibuprofen" && m < 6);
  $("agefield").className = "agefield" + (aValid ? " ok" : "");
  $("a-ok").hidden = !aValid;

  /* червоні блоки: дані дитини окремо від препарату */
  const childCodes = ["age_under_3m", "par_weight_below_4", "adult_ceiling"];
  const child = notes.filter((n) => childCodes.indexOf(n.code) > -1);
  const drugNotes = notes.filter((n) => childCodes.indexOf(n.code) === -1 && n.level !== "info");
  fillAlert($("alert-child"), $("alert-child-body"), child);
  fillAlert($("alert-drug"), $("alert-drug-body"), drugNotes);

  const res = $("result");
  if (blocked) {
    res.className = "result blocked";
    res.innerHTML = '<p class="kicker">' + T.blockedSub + '</p><div class="figure">' + T.blockedTitle + "</div>";
    $("detail").hidden = true; $("howcard").hidden = true;
    return;
  }
  const dose = computeDose(inp);
  if (!dose.ok) {
    res.className = "result";
    res.innerHTML = '<p class="kicker">' + T.resultKicker + "</p><p style='margin:0;font-size:15px'>" + T.emptyResult + "</p>";
    $("detail").hidden = true; $("howcard").hidden = true;
    return;
  }

  const p = currentPreset();
  const unit = dose.unit === "ml" ? T.units.ml : plural(T.units[dose.unit], dose.amount);
  res.className = "result on";
  res.innerHTML =
    '<p class="kicker">' + T.resultKicker + " · " + T[state.drug] + " · " + nf(w) + " " + T.kg + "</p>" +
    '<div class="figure">' + nf(dose.amount) + ' <span>' + unit + "</span></div>" +
    '<p class="second">' + nf(dose.actualMg, 0) + " " + (state.lang === "uk" ? "мг" : "mg") + " · " + p.mg + (p.ml ? "/" + p.ml + " " + T.units.ml : "") + "</p>" +
    '<button type="button" class="cta" id="logbtn">' + T.logDose + "</button>";
  $("logbtn").addEventListener("click", () => logDose(dose, unit));

  const rows = [];
  if (dose.unit === "ml") rows.push([T.rows.syringes, nf(dose.amount / 5)]);
  else rows.push([T.rows.whole, nf(dose.amount, 0) + " " + unit]);
  rows.push([T.rows.interval, T.intervalText[state.drug]]);
  rows.push([T.rows.maxDoses, String(dose.dosesPerDay)]);
  rows.push([T.rows.maxDaily, nf(dose.dailyLimitMg, 0) + " " + (state.lang === "uk" ? "мг" : "mg")]);
  rows.push([T.rows.range, nf(dose.minMg, 0) + "–" + nf(dose.maxMg, 0) + " " + (state.lang === "uk" ? "мг" : "mg")]);
  $("rows").innerHTML = rows.map((r) => "<div><dt>" + r[0] + "</dt><dd>" + r[1] + "</dd></div>").join("");
  $("detail").hidden = false;
  $("howcard").hidden = false;
}

function fillAlert(box, body, notes) {
  if (!notes.length) { box.hidden = true; return; }
  box.hidden = false;
  body.innerHTML = notes.map((n) => "<p>" + noteText(n, state.lang) + "</p>").join("");
}

/* ── журнал і таймери ── */
function logDose(dose, unit) {
  state.doses.unshift({
    t: Date.now(), drug: state.drug, mg: Math.round(dose.actualMg),
    text: nf(dose.amount) + " " + unit
  });
  state.doses = state.doses.slice(0, 30);
  save();
  switchTab("next");
  renderNext();
}

function lastDose(drug) {
  const found = state.doses.find((d) => d.drug === drug);
  return found ? new Date(found.t) : null;
}
function todayDoses(drug) {
  const since = Date.now() - 24 * 3600000;
  return state.doses.filter((d) => d.drug === drug && d.t >= since);
}

function renderNext() {
  const T = t();
  const now = new Date();
  ["paracetamol", "ibuprofen"].forEach((id) => {
    const drug = DRUGS[id];
    const other = id === "paracetamol" ? "ibuprofen" : "paracetamol";
    const mine = todayDoses(id);
    const info = nextDoseTime(id, lastDose(id), mine.length, now, lastDose(other));
    const mg = mine.reduce((s, d) => s + d.mg, 0);
    const w = weightNum();
    const maxMg = isFinite(w) ? Math.min(drug.dailyPerKg * w, drug.maxDailyMg) : drug.maxDailyMg;
    const pct = Math.min(100, Math.round((mg / maxMg) * 100));

    let fig = T.now;
    if (!info.ready) {
      const mins = Math.ceil(info.waitMs / 60000);
      const h = Math.floor(mins / 60), mm = mins % 60;
      fig = state.lang === "uk"
        ? (h ? h + " год " : "") + mm + " хв"
        : (h ? h + "h " : "") + mm + "min";
    }
    let note;
    const last = lastDose(id);
    if (info.reason === "cross") note = T.crossAt(T[other], hhmm(info.at));
    else if (info.reason === "same") note = T.nextAt(hhmm(last), hhmm(info.at));
    else note = last ? T.lastAt(hhmm(last)) : T.noneYet;

    $("timer-" + id).innerHTML =
      '<div class="timerhead"><b>' + T[id] + "</b>" +
      '<span class="status' + (info.ready && !info.limitReached ? " go" : "") + '">' +
      (info.ready && !info.limitReached ? T.ready : T.waiting) + "</span></div>" +
      '<div class="timerfig">' + fig + "</div>" +
      '<p class="timernote">' + note + "</p>" +
      '<div class="bar' + (pct > 85 ? " hot" : "") + '"><i style="width:' + pct + '%"></i></div>' +
      '<p class="barcap">' + T.perDay(mine.length, drug.maxDoses, nf(mg, 0), nf(maxMg, 0)) + "</p>";
  });

  const body = $("logbody");
  if (!state.doses.length) {
    body.innerHTML = '<p class="note-sm" style="margin:0">' + T.logEmpty + "</p>";
    $("undo").hidden = true;
    return;
  }
  $("undo").hidden = false;
  body.innerHTML = state.doses.map((d) =>
    '<div class="logrow"><b>' + hhmm(d.t) + "</b><span>" + T[d.drug] + "</span><span>" + d.text + "</span></div>"
  ).join("");
}

/* ── вкладки ── */
function switchTab(tab) {
  state.tab = tab;
  [["dose", "view-dose"], ["next", "view-next"], ["src", "view-src"]].forEach(([k, v]) => {
    $("tab-" + k).setAttribute("aria-selected", String(k === tab));
    $(v).hidden = k !== tab;
  });
  if (tab === "next") renderNext();
}

/* ── події ── */
$("weight").addEventListener("input", (e) => { state.weight = e.target.value; save(); render(); });
$("age").addEventListener("input", (e) => { state.age = e.target.value; save(); render(); });
$("ageUnit").addEventListener("change", (e) => { state.ageUnit = e.target.value; save(); render(); });
$("preset").addEventListener("change", (e) => { state.presetIndex = Number(e.target.value); save(); render(); });

["paracetamol", "ibuprofen"].forEach((id) => {
  $("d-" + id).addEventListener("click", () => {
    state.drug = id;
    $("d-paracetamol").setAttribute("aria-pressed", String(id === "paracetamol"));
    $("d-ibuprofen").setAttribute("aria-pressed", String(id === "ibuprofen"));
    state.presetIndex = 0;
    paintChips(); paintPresets(); save(); render();
  });
});
$("chips").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-form]");
  if (!b) return;
  state.form = b.dataset.form;
  state.presetIndex = 0;
  paintChips(); paintPresets(); save(); render();
});
$("clear").addEventListener("click", () => {
  state.weight = ""; state.age = ""; state.presetIndex = 0;
  $("weight").value = ""; $("age").value = "";
  paintPresets(); save(); render(); $("weight").focus();
});
$("undo").addEventListener("click", () => { state.doses.shift(); save(); renderNext(); });

[["dose", "tab-dose"], ["next", "tab-next"], ["src", "tab-src"]].forEach(([k, id]) =>
  $(id).addEventListener("click", () => switchTab(k)));

["uk", "en"].forEach((lang) => $("lang-" + lang).addEventListener("click", () => {
  state.lang = lang; save(); paintChrome(); paintChips(); paintPresets(); render();
  if (state.tab === "next") renderNext();
}));
$("theme").addEventListener("click", () => {
  state.theme = state.theme === "dark" ? "light" : "dark";
  applyTheme(); save();
});
function applyTheme() {
  const dark = state.theme === "dark";
  document.documentElement.dataset.theme = dark ? "dark" : "light";
  $("theme").setAttribute("aria-pressed", String(dark));
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.content = dark ? "#181716" : "#f3f2f2";
}

/* ── старт ── */
load();
if (!DRUGS[state.drug]) state.drug = "paracetamol";
$("weight").value = state.weight;
$("age").value = state.age;
$("ageUnit").value = state.ageUnit;
$("d-paracetamol").setAttribute("aria-pressed", String(state.drug === "paracetamol"));
$("d-ibuprofen").setAttribute("aria-pressed", String(state.drug === "ibuprofen"));
applyTheme();
paintChrome();
paintChips();
paintPresets();
render();
setInterval(() => { if (state.tab === "next") renderNext(); }, 1000);

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
</script>
</body>
</html>
